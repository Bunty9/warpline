name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: warpline
          POSTGRES_PASSWORD: warpline
          POSTGRES_DB: warpline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U warpline -d warpline_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Picked up by crates/{host,control}/tests/db_mode.rs — unset in a
      # local run, those tests just skip themselves.
      WARPLINE_TEST_DATABASE_URL: postgres://warpline:warpline@localhost:5432/warpline_test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo nextest
        run: cargo nextest run --workspace --no-fail-fast

  msrv:
    name: cargo check (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read MSRV from Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # rust-toolchain.toml pins `stable` and would override the rustup
      # default set above; force the MSRV explicitly.
      - name: cargo check --workspace
        run: cargo check --workspace
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  package:
    name: cargo package (publish readiness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds each crate from its packaged tarball, catching files read
      # outside the crate dir (wit/, migrations/) or missing metadata.
      - name: cargo package --workspace
        run: cargo package --workspace

  bench:
    name: criterion (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo bench --no-run
        run: cargo bench --workspace --no-run

  build-guest-fixture:
    name: build guests (wasm32-wasip2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned guest toolchain (examples/rust-toolchain.toml)
        working-directory: examples
        run: rustup toolchain install
      - name: Build examples/{hello-wasm,test-guest} and refresh the test fixture
        run: ./scripts/build-guests.sh
      # `scripts/build-guests.sh` overwrites
      # crates/core/tests/fixtures/test_guest.wasm from a fresh build of
      # examples/test-guest. Verified locally (two clean `cargo build
      # --release --target wasm32-wasip2` runs of examples/test-guest) that
      # the output is byte-for-byte reproducible on the toolchain pinned in
      # examples/rust-toolchain.toml, so a
      # diff here means the committed fixture is stale relative to
      # examples/test-guest's source and needs `./scripts/build-guests.sh`
      # run and committed.
      - name: Fail if the committed fixture is stale
        run: git diff --exit-code -- crates/core/tests/fixtures/test_guest.wasm

  example:
    name: examples/storefront
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: storefront
          POSTGRES_PASSWORD: storefront
          POSTGRES_DB: storefront
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storefront -d storefront"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WARPLINE_TEST_DATABASE_URL: postgres://storefront:storefront@localhost:5432/storefront
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned toolchain (examples/rust-toolchain.toml)
        working-directory: examples
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            examples/storefront/app
            examples/storefront/hook
      - name: Rebuild the hook; fail if the committed fixture is stale
        run: |
          examples/storefront/build.sh
          git diff --exit-code -- examples/storefront/app/tests/fixtures/checkout_hook.wasm
      - name: app fmt
        working-directory: examples/storefront/app
        run: cargo fmt --check
      - name: app clippy
        working-directory: examples/storefront/app
        run: cargo clippy --all-targets -- -D warnings
      - name: app tests
        working-directory: examples/storefront/app
        run: cargo test
      - name: hook fmt
        working-directory: examples/storefront/hook
        run: cargo fmt --check
      - name: hook clippy
        working-directory: examples/storefront/hook
        run: cargo clippy --target wasm32-wasip2 -- -D warnings
      # The same walkthrough as `./demo.sh --up`, minus docker compose: the
      # binaries run on the runner and share the Postgres service above.
      - name: Live demo
        working-directory: examples/storefront/app
        env:
          DATABASE_URL: postgres://storefront:storefront@localhost:5432/storefront
          ADMIN_TOKEN: demo-admin-token
          FRAUD_API: http://127.0.0.1:3100
          MODULES_DIR: ${{ runner.temp }}/modules
        run: |
          cargo build --release --bins
          ./target/release/fraud-mock > "$RUNNER_TEMP/fraud.log" 2>&1 &
          ./target/release/storefront > "$RUNNER_TEMP/storefront.log" 2>&1 &
          trap 'echo "--- fraud-mock"; cat "$RUNNER_TEMP/fraud.log"; echo "--- storefront"; cat "$RUNNER_TEMP/storefront.log"' EXIT
          for url in http://127.0.0.1:3100/ http://127.0.0.1:3000/healthz; do
            for _ in $(seq 60); do
              curl -sS -o /dev/null "$url" 2>/dev/null && break
              sleep 1
            done
            curl -sS -o /dev/null "$url"
          done
          FRAUD_HOST=127.0.0.1 ../demo.sh
