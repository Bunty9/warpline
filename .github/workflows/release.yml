name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    # crates.io trusted publishing is bound to this workflow file and
    # environment; the environment only allows v* tags.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag must equal the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="warpline-core"))')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match workspace version v$version" >&2; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") == 4; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "no CHANGELOG.md section for ${TAG#v}" >&2; exit 1; }
      - name: cargo package --workspace
        run: cargo package --workspace
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: cargo publish --workspace
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "warpline ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
