name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  # Dry run: runs only `preflight` and `build` and uploads the archives as
  # workflow artifacts. `publish`, `release` and `docker` run on tag pushes
  # only (the `release` environment only allows v* tags anyway), so the
  # input cannot turn a dispatch into a release.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the archives only (no publish, release or image; always the case on dispatch)'
        type: boolean
        default: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # No secrets, no environment: everything that can fail before anything
  # irreversible happens.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tagged commit must be on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on origin/main; refusing to publish" >&2; exit 1; }
      # Pinned to the tip of the action's `stable` branch; with a SHA the
      # toolchain must be named explicitly.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Workspace version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="warpline-core"))')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tag must equal the workspace version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$TAG" = "v$VERSION" ] || { echo "tag $TAG does not match workspace version v$VERSION" >&2; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") == 4; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "no CHANGELOG.md section for ${TAG#v}" >&2; exit 1; }
      - name: cargo package --workspace
        run: cargo package --workspace --locked
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: notes
          path: ${{ runner.temp }}/notes.md
          if-no-files-found: error

  build:
    needs: preflight
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          # Cross-compiled on the arm64 macOS runner. If aws-lc-sys fails
          # here, switch this row to `macos-15-intel`.
          - { target: x86_64-apple-darwin, os: macos-latest }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # No build cache on purpose: release binaries come from a clean build.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          # BSD tar on macOS: keep AppleDouble/xattr entries out of the archive.
          COPYFILE_DISABLE: "1"
        run: cargo build --release --locked -p warpline-host -p warpline-control --target "$TARGET"
      # Layout: warpline-v<version>-<target>/{warpline-host,warpline-control,
      # LICENSE-*,README.md}; keep in sync with `bin-dir` in
      # [package.metadata.binstall].
      - name: Package
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
          # BSD tar on macOS: keep AppleDouble/xattr entries out of the archive.
          COPYFILE_DISABLE: "1"
        run: |
          d="warpline-v$VERSION-$TARGET"
          mkdir -p "dist/$d"
          cp "target/$TARGET/release/warpline-host" "target/$TARGET/release/warpline-control" \
            LICENSE-APACHE LICENSE-MIT README.md "dist/$d/"
          tar -C dist -czf "dist/$d.tar.gz" "$d"
          rm -rf "dist/$d"
          if [ "$RUNNER_OS" = Linux ]; then
            # Informational: the glibc floor of the archive.
            tar -xzOf "dist/$d.tar.gz" "$d/warpline-host" > "$RUNNER_TEMP/h"
            objdump -T "$RUNNER_TEMP/h" | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # crates.io publication cannot be undone, so it runs only after every
  # target built. Trusted publishing is bound to this workflow file and the
  # `release` environment (which only allows v* tags): keep both.
  publish:
    if: github.event_name == 'push'
    needs: [preflight, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Re-runnable after a partial publish: only crates missing from
      # crates.io are published, one at a time in dependency order (each
      # `cargo publish -p` waits for the index). --no-verify: preflight's
      # `cargo package` already built the identical tarballs, and the token
      # is short-lived.
      - name: cargo publish (crates not yet on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for c in warpline-core warpline-control warpline-host; do
            if curl -sfA 'warpline-release (github.com/Bunty9/warpline)' "https://crates.io/api/v1/crates/$c/$v" >/dev/null; then
              echo "$c $v already published, skipping"
            else
              cargo publish --locked --no-verify -p "$c"
            fi
          done

  # Draft, upload, verify, then publish the release: re-runnable at every step.
  release:
    if: github.event_name == 'push'
    needs: [preflight, build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: assets
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: notes
          path: notes
      - name: Verify the archives and write SHA256SUMS
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          cd assets
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            [ -f "warpline-v$VERSION-$t.tar.gz" ] || { echo "missing archive for $t" >&2; exit 1; }
          done
          [ "$(ls -- *.tar.gz | wc -l)" = 4 ] || { echo "unexpected archives:" >&2; ls >&2; exit 1; }
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*.tar.gz
      - name: GitHub release (draft, upload, publish)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            pre=; case "$TAG" in *-*) pre=--prerelease ;; esac
            gh release create "$TAG" --draft $pre --title "warpline ${TAG#v}" --notes-file notes/notes.md
          fi
          gh release upload "$TAG" assets/* --clobber
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin; do
            gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx "warpline-$TAG-$t.tar.gz" \
              || { echo "release is missing the $t archive" >&2; exit 1; }
          done
          gh release view "$TAG" --json assets --jq '.assets[].name' | grep -qx SHA256SUMS \
            || { echo "release is missing SHA256SUMS" >&2; exit 1; }
          gh release edit "$TAG" --draft=false

  # Multi-arch image from the release's own Linux binaries. The Fly deploy
  # still builds the `runtime-root` target of the root Dockerfile (root user
  # for fresh Fly volumes); no release image variant for it.
  docker:
    if: github.event_name == 'push'
    needs: [preflight, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*-unknown-linux-gnu
          path: assets
          merge-multiple: true
      - name: Stage the build context
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}; t=${pair##*:}-unknown-linux-gnu
            mkdir -p "ctx/linux-$arch"
            tar -xzf "assets/warpline-v$VERSION-$t.tar.gz" -C "ctx/linux-$arch" --strip-components=1
          done
          mkdir -p ctx/rootfs/var/lib/warpline/modules
          touch ctx/rootfs/var/lib/warpline/modules/.keep
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          # Image names must be lowercase.
          images: ghcr.io/bunty9/warpline
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          flavor: latest=auto
      - id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ctx
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The attestation step below records provenance.
          provenance: false
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/bunty9/warpline
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
