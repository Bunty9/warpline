name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest
    # crates.io trusted publishing is bound to this workflow file and
    # environment; the environment only allows v* tags.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tagged commit must be on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "$GITHUB_SHA is not on origin/main; refusing to publish" >&2; exit 1; }
      # Pinned to the tip of the action's `stable` branch; with a SHA the
      # toolchain must be named explicitly.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Tag must equal the workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="warpline-core"))')
          [ "$TAG" = "v$version" ] || { echo "tag $TAG does not match workspace version v$version" >&2; exit 1; }
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v v="${TAG#v}" '/^## \[/ { p = index($0, "[" v "]") == 4; next } p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "no CHANGELOG.md section for ${TAG#v}" >&2; exit 1; }
      - name: cargo package --workspace
        run: cargo package --workspace --locked
      - name: Get a short-lived crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      # Re-runnable after a partial publish: only crates missing from
      # crates.io are published, one at a time in dependency order (each
      # `cargo publish -p` waits for the index). --no-verify: `cargo package`
      # above already built the identical tarballs, and the token is
      # short-lived.
      - name: cargo publish (crates not yet on crates.io)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          for c in warpline-core warpline-control warpline-host; do
            if curl -sfA 'warpline-release (github.com/Bunty9/warpline)' "https://crates.io/api/v1/crates/$c/$v" >/dev/null; then
              echo "$c $v already published, skipping"
            else
              cargo publish --locked --no-verify -p "$c"
            fi
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, skipping"
          else
            gh release create "$TAG" --title "warpline ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
