[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/host",
    "crates/control",
]
# `examples/hello-wasm` is intentionally NOT a workspace member: it targets
# `wasm32-wasip1` and would conflict with the host-platform build graph (its
# deps are different and it has its own `Cargo.lock`). Build it directly with
# `cargo build --target wasm32-wasip1 --release` from inside that directory.
exclude = [
    "examples/hello-wasm",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
rust-version = "1.78"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Runtime + HTTP — pinned to backend-cloud-roadmap.md § 3.
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Postgres for tenant + metering tables.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }

# WASM runtime. Features cover async invocation, cranelift codegen, parallel
# compilation of large module sets, and the WASI Component-Model surface that
# `wit-bindgen` targets.
wasmtime = { version = "27", features = ["async", "cranelift", "parallel-compilation", "component-model"] }
wasmtime-wasi = "27"

# Async trait objects for the KvStore abstraction in `core::kv`.
async-trait = "0.1"

# `.cwasm` cache key — content-hash the source wasm bytes.
sha2 = "0.10"
hex = "0.4"

# Outbound HTTP for the host-side `http-out` capability (TODO behind a stub
# in Phase 1; see crates/core/src/runtime.rs).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# Serde everywhere — request/response envelopes, config files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors.
anyhow = "1"
thiserror = "2"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Multipart upload parsing in `warpline-control`.
bytes = "1"
uuid = { version = "1", features = ["v7", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
