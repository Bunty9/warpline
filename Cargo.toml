[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/host",
    "crates/control",
]
# `examples/hello-wasm` and `examples/test-guest` are intentionally NOT
# workspace members: they target `wasm32-wasip2` and would conflict with the
# host-platform build graph (different deps, own `Cargo.lock`). Build them
# directly with `scripts/build-guests.sh` or `cargo build --target
# wasm32-wasip2 --release` from inside each directory.
exclude = [
    "examples/hello-wasm",
    "examples/test-guest",
    # The storefront reference example: standalone crates with their own
    # Cargo.lock (see examples/storefront/README.md).
    "examples/storefront/app",
    "examples/storefront/hook",
]

[workspace.package]
edition = "2021"
version = "0.2.1"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bunty9/warpline"
homepage = "https://github.com/Bunty9/warpline"
keywords = ["wasm", "wasmtime", "webassembly", "multi-tenant", "serverless"]

[workspace.dependencies]
# Runtime + HTTP — pinned to backend-cloud-roadmap.md § 3.
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Postgres for tenant + metering tables.
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros", "migrate"] }

# WASM runtime. `default-features = false` because upstream defaults now pull
# in gc/pooling-allocator/wit-parser/wat/cache/etc that this host never uses;
# the explicit feature list is the minimum `bindgen!` + async component
# instantiation + parallel cranelift compilation need.
wasmtime = { version = "49", default-features = false, features = ["async", "cranelift", "parallel-compilation", "component-model", "anyhow"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }

# Async trait objects for the KvStore abstraction in `core::kv`.
async-trait = "0.1"

# `.cwasm` cache key — content-hash the source wasm bytes.
sha2 = "0.10"
hex = "0.4"

# Outbound HTTP for the host-side `http-out` capability.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
url = "2"

# Serde everywhere — request/response envelopes, config files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors.
anyhow = "1"
thiserror = "2"

# Observability.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.18"

# Multipart upload parsing in `warpline-control`.
bytes = "1"
uuid = { version = "1", features = ["v7", "serde"] }

# In-memory component LRU (`core::registry::ComponentCache`).
lru = "0.18"
# 32-byte API key generation (`warpline-control`'s admin route).
getrandom = "0.3"

# Bench harness (Task 3, `crates/core/benches/*`).
criterion = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
