[package]
name = "warpline-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed multi-tenant WebAssembly runtime core for warpline: wasmtime Component Model host bindings, epoch CPU and memory caps, tenant-scoped KV, allowlisted outbound HTTP, content-addressed module cache and metering."
documentation = "https://docs.rs/warpline-core"
categories = ["wasm", "web-programming"]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
uuid = { workspace = true }
lru = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "report"
harness = false
