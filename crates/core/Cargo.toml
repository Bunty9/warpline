[package]
name = "warpline-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Sandboxed multi-tenant WebAssembly runtime core for warpline: wasmtime Component Model host bindings, epoch CPU and memory caps, tenant-scoped KV, allowlisted outbound HTTP, content-addressed module cache and metering."
documentation = "https://docs.rs/warpline-core"
categories = ["wasm", "web-programming"]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"

[lib]
path = "src/lib.rs"

[features]
default = ["postgres"]
# Postgres-backed auth, tenant admin and metering (`warpline_core::pg`).
postgres = ["dep:sqlx", "dep:getrandom"]

[dependencies]
tokio = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }
async-trait = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
url = { workspace = true }
sqlx = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
bytes = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tempfile = "3"
lru = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
# Hand-written WAT components in tests (e.g. a looping start function).
wat = "1"

[[bench]]
name = "runtime"
harness = false

[[bench]]
name = "report"
harness = false
