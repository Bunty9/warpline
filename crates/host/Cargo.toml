[package]
name = "warpline-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "warpline invoke server: runs tenants' WebAssembly components over HTTP with per-tenant CPU, memory and egress limits, API-key auth and metering."
categories = ["wasm", "web-programming::http-server", "command-line-utilities"]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"
# Integration tests read the fixture from crates/core, which isn't in
# this package; ship without them rather than with tests that don't build.
exclude = ["tests/"]

[[bin]]
name = "warpline-host"
path = "src/main.rs"

[dependencies]
# Optional in-process control plane (`WARPLINE_EMBED_CONTROL=1`) for
# single-machine deploys where host and control must share one volume.
warpline-control = { path = "../control", version = "0.1.0" }
warpline-core = { path = "../core", version = "0.1.0" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Dev-mode end-to-end tests upload through the real control-plane router
# into a shared tempdir modules dir, then invoke through this crate's.
