[package]
name = "warpline-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "warpline control plane: authenticated WebAssembly component uploads, compile-time import checks, content-addressed module registry and tenant/API-key administration."
categories = ["wasm", "web-programming::http-server", "command-line-utilities"]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"
# Integration tests read the fixture from crates/core, which isn't in
# this package; ship without them rather than with tests that don't build.
exclude = ["tests/"]

# Prebuilt archive attached to the GitHub release (one archive holds both
# binaries under a `warpline-v<version>-<target>/` directory; keep in sync with
# the Package step in .github/workflows/release.yml).
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/warpline-v{ version }-{ target }.tar.gz"
bin-dir = "warpline-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "warpline-control"
path = "src/main.rs"

[dependencies]
warpline-core = { path = "../core", version = "0.2.1" }
tokio = { workspace = true }
axum = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
tower = { workspace = true }
