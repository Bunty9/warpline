[package]
name = "warpline-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "warpline control plane: authenticated WebAssembly component uploads, compile-time import checks, content-addressed module registry and tenant/API-key administration."
categories = ["wasm", "web-programming::http-server", "command-line-utilities"]
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
readme = "../../README.md"
# Integration tests read the fixture from crates/core, which isn't in
# this package; ship without them rather than with tests that don't build.
exclude = ["tests/"]

[[bin]]
name = "warpline-control"
path = "src/main.rs"

[dependencies]
warpline-core = { path = "../core", version = "0.1.0" }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
bytes = { workspace = true }

[dev-dependencies]
tempfile = "3"
