# Fly.io deployment manifest for warpline.
#
# Single region — the whole point of warpline is multi-tenant compute on one
# host. Geographic distribution is a Phase-3 problem; for the portfolio demo
# everything lives in `sin` next to the operator.
#
# Deploy:
#   fly launch --copy-config --no-deploy
#   fly scale count 1 --region sin
#   fly deploy

app = "warpline"
primary_region = "sin"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"
  # Root runtime: the Fly volume mount is root-owned (see Dockerfile).
  build-target = "runtime-root"

[env]
  RUST_LOG = "info"
  WARPLINE_HOST_BIND = "0.0.0.0:8080"
  WARPLINE_CONTROL_BIND = "0.0.0.0:8081"
  WARPLINE_MODULES_DIR = "/var/lib/warpline/modules"
  # Fly volumes attach to a single machine, so run the control plane inside
  # the host process (same engine, same volume).
  WARPLINE_EMBED_CONTROL = "1"
  # NOTE: DATABASE_URL and WARPLINE_ADMIN_TOKEN must be set as Fly secrets
  # fly secrets set DATABASE_URL='postgres://...'
  # fly secrets set WARPLINE_ADMIN_TOKEN='...'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  internal_port = 8081
  protocol = "tcp"

  [[services.ports]]
    port = 8081
    handlers = ["tls", "http"]

[[regions]]
  code = "sin"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "warpline_modules"
  destination = "/var/lib/warpline/modules"
